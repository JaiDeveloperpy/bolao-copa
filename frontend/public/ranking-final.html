<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ranking Final — JaiBet 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a1a0e;
      color: #e6f0e6;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
    }

    .container { max-width: 680px; margin: 0 auto; }

    /* Header */
    .header-card {
      background: linear-gradient(135deg, #1a1000, #2a1f00);
      border: 2px solid #f5c518;
      border-radius: 18px;
      padding: 2rem;
      text-align: center;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 60px rgba(245,197,24,0.2);
      position: relative;
      overflow: hidden;
    }
    .header-card::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(245,197,24,0.1) 0%, transparent 70%);
    }
    .header-card .trophy { font-size: 3.5rem; display: block; margin-bottom: 0.5rem; position:relative;z-index:1 }
    .header-card h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem; letter-spacing: 3px;
      background: linear-gradient(135deg, #ffe066, #f5c518, #c99b10);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      position:relative;z-index:1
    }
    .header-card p { color: rgba(245,197,24,0.5); font-size: 0.82rem; margin-top: 0.3rem; position:relative;z-index:1 }

    /* Ranking rows */
    .ranking-list { display: flex; flex-direction: column; gap: 0.5rem; }

    .row {
      display: flex; align-items: center; gap: 1rem;
      background: rgba(10,30,15,0.9);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; padding: 0.9rem 1.1rem;
      position: relative; overflow: hidden;
    }
    .row::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    }
    .row.pos-1 { border-color: rgba(245,197,24,0.4); background: rgba(245,197,24,0.06); }
    .row.pos-1::before { background: #f5c518; }
    .row.pos-2 { border-color: rgba(192,192,192,0.25); }
    .row.pos-2::before { background: #c0c0c0; }
    .row.pos-3 { border-color: rgba(205,127,50,0.25); }
    .row.pos-3::before { background: #cd7f32; }

    .medal { font-size: 1.3rem; min-width: 32px; text-align: center; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, #0f5c2e, #1a8a44);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
      overflow: hidden; border: 1px solid rgba(57,255,137,0.15);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .info { flex: 1; }
    .name { font-weight: 700; font-size: 0.95rem; }
    .pos-1 .name { color: #f5c518; }
    .details { display: flex; gap: 0.75rem; margin-top: 0.2rem; flex-wrap: wrap; }
    .detail { font-size: 0.68rem; color: rgba(255,255,255,0.4); }
    .detail span { color: rgba(255,255,255,0.75); font-weight: 600; }
    .pts {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.7rem; color: #f5c518; letter-spacing: 1px; flex-shrink: 0;
    }
    .pts small { font-family: 'DM Sans', sans-serif; font-size: 0.6rem; color: rgba(245,197,24,0.4); display: block; text-align: right; }

    /* Footer */
    .footer {
      text-align: center; margin-top: 2rem; padding-top: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 0.72rem; color: rgba(255,255,255,0.2);
    }
    .footer strong { color: rgba(245,197,24,0.5); }

    /* Botão download */
    .download-btn {
      display: block; width: 100%; margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #0f5c2e, #1a8a44);
      color: #fff; border: none; border-radius: 10px;
      padding: 0.85rem; font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 16px rgba(15,92,46,0.4);
      transition: all 0.2s ease;
    }
    .download-btn:hover { background: linear-gradient(135deg, #1a8a44, #39ff89); color: #040f08; }

    .loading { text-align: center; padding: 3rem; color: rgba(255,255,255,0.3); }
  </style>
</head>
<body>
<div class="container">

  <div class="header-card">
    <span class="trophy">🏆</span>
    <h1>Ranking Final JaiBet 2026</h1>
    <p>Copa do Mundo FIFA 2026 · Resultado final do bolão</p>
  </div>

  <button class="download-btn" onclick="downloadRanking()">📥 Salvar como imagem</button>

  <div id="ranking-list" class="ranking-list">
    <div class="loading">Carregando ranking...</div>
  </div>

  <div class="footer">
    🙏 Agradecimento especial ao <strong>Paulo Lima</strong> pelo patrocínio financeiro do bolão
    · JaiBet 2026
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const API = window.location.hostname === 'localhost'
  ? 'http://localhost:3001/api'
  : 'https://bolao-copa-production-b75c.up.railway.app/api';

const token = () => localStorage.getItem('token');

async function loadRanking() {
  const list = document.getElementById('ranking-list');
  try {
    const res = await fetch(API + '/ranking', {
      headers: { Authorization: `Bearer ${token()}` }
    });
    if (!res.ok) {
      list.innerHTML = '<div class="loading">Faça login no site principal primeiro.</div>';
      return;
    }
    const rows = await res.json();

    list.innerHTML = rows.map((r, i) => {
      const pos = i + 1;
      const medal = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : pos;
      const posClass = pos <= 3 ? `pos-${pos}` : '';
      const initials = r.name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase();
      const avatarHtml = r.avatar_url
        ? `<img src="${r.avatar_url}" alt="${r.name}" />`
        : initials;

      return `
        <div class="row ${posClass}">
          <div class="medal">${medal}</div>
          <div class="avatar">${avatarHtml}</div>
          <div class="info">
            <div class="name">${r.name}</div>
            <div class="details">
              <div class="detail">🎯 Exatos: <span>${r.exact_scores}</span></div>
              <div class="detail">7️⃣ 7pts: <span>${r.winner_diff}</span></div>
              <div class="detail">5️⃣ 5pts: <span>${r.winner_only}</span></div>
              <div class="detail">❌ Erros: <span>${r.misses}</span></div>
            </div>
          </div>
          <div class="pts">${r.total_points}<small>pontos</small></div>
        </div>`;
    }).join('');

  } catch (e) {
    list.innerHTML = '<div class="loading">Erro ao carregar. Faça login primeiro.</div>';
  }
}

async function downloadRanking() {
  const btn = document.querySelector('.download-btn');
  btn.textContent = '⏳ Gerando imagem...';
  btn.disabled = true;

  try {
    const el = document.querySelector('.container');
    const canvas = await html2canvas(el, {
      backgroundColor: '#0a1a0e',
      scale: 2,
      useCORS: true,
      logging: false,
    });
    const link = document.createElement('a');
    link.download = 'ranking-final-jaibet-2026.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (e) {
    alert('Erro ao gerar imagem. Tente tirar um print manual.');
  }

  btn.textContent = '📥 Salvar como imagem';
  btn.disabled = false;
}

loadRanking();
</script>
</body>
</html>
