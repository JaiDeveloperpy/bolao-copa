<!DOCTYPE html>
<!--
  =====================================================================
  ARQUIVO: frontend/public/palpites.html
  Aba standalone de "Todos os Palpites" para o bolão-copa.

  COMO INTEGRAR AO PROJETO EXISTENTE:
  1. Salve este arquivo em: frontend/public/palpites.html
  2. Em frontend/public/index.html, adicione o link de navegação:
        <a href="/palpites.html">🔍 Palpites</a>
  3. No backend, certifique-se que a rota GET /api/bets/all-by-match
     está registrada (use o arquivo backend_routes_bets_public.js fornecido).
  =====================================================================
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palpites — Bolão Copa 2026</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ── Variáveis de tema ───────────────────────────────────────── */
    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #21262d;
      --border:    #30363d;
      --accent:    #238636;
      --accent-h:  #2ea043;
      --gold:      #e3a008;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --red:       #da3633;
      --green:     #3fb950;
      --radius:    10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    header .brand {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: .9rem;
      margin-left: 16px;
      transition: color .2s;
    }
    header nav a:hover, header nav a.active { color: var(--text); }
    header nav a.active { font-weight: 600; }

    /* ── Controles / filtros ─────────────────────────────────────── */
    .controls {
      max-width: 960px;
      margin: 24px auto 0;
      padding: 0 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .controls input[type="text"] {
      flex: 1;
      min-width: 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 14px;
      color: var(--text);
      font-size: .9rem;
      outline: none;
      transition: border-color .2s;
    }
    .controls input[type="text"]:focus { border-color: var(--accent); }
    .controls select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      color: var(--text);
      font-size: .9rem;
      cursor: pointer;
      outline: none;
    }

    /* ── Lista de jogos ──────────────────────────────────────────── */
    .matches-list {
      max-width: 960px;
      margin: 20px auto 48px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Card de jogo ────────────────────────────────────────────── */
    .match-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* cabeçalho do card */
    .match-header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      cursor: pointer;
      user-select: none;
      transition: background .15s;
    }
    .match-header:hover { background: var(--surface2); }

    .match-teams {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      font-size: 1rem;
      font-weight: 600;
    }
    .flag { font-size: 1.4rem; }

    .match-score {
      font-size: 1.3rem;
      font-weight: 700;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 14px;
      min-width: 64px;
      text-align: center;
      letter-spacing: 2px;
    }

    .match-meta {
      font-size: .78rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .badge {
      font-size: .72rem;
      padding: 3px 9px;
      border-radius: 20px;
      font-weight: 600;
    }
    .badge-closed  { background: #21262d; color: var(--muted); }
    .badge-open    { background: #1f3a1a; color: var(--green); }
    .badge-done    { background: #1a2a1a; color: var(--green); }

    .chevron {
      font-size: .85rem;
      color: var(--muted);
      transition: transform .25s;
      margin-left: auto;
    }
    .match-card.open .chevron { transform: rotate(180deg); }

    /* ── Tabela de palpites ──────────────────────────────────────── */
    .bets-panel {
      display: none;
      border-top: 1px solid var(--border);
    }
    .match-card.open .bets-panel { display: block; }

    .bets-panel table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }
    .bets-panel th {
      background: var(--surface2);
      padding: 9px 14px;
      text-align: left;
      font-weight: 600;
      font-size: .78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .bets-panel td {
      padding: 9px 14px;
      border-top: 1px solid var(--border);
      vertical-align: middle;
    }
    .bets-panel tr:hover td { background: var(--surface2); }

    .bet-score {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 1px;
    }
    .bet-score.exact   { color: var(--gold); }
    .bet-score.winner  { color: var(--green); }
    .bet-score.wrong   { color: var(--red); }
    .bet-score.pending { color: var(--text); }

    .pts {
      font-weight: 700;
    }
    .pts.p10 { color: var(--gold); }
    .pts.p7  { color: var(--green); }
    .pts.p5  { color: #58a6ff; }
    .pts.p0  { color: var(--red); }

    .user-me { font-weight: 700; }
    .you-tag {
      font-size: .68rem;
      background: var(--accent);
      color: #fff;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 6px;
    }

    .empty-bets {
      padding: 16px;
      color: var(--muted);
      font-size: .85rem;
      text-align: center;
    }

    /* ── Loading / erro ──────────────────────────────────────────── */
    .state-box {
      max-width: 960px;
      margin: 60px auto;
      text-align: center;
      color: var(--muted);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsivo ──────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .match-teams { font-size: .9rem; }
      .bets-panel th, .bets-panel td { padding: 7px 10px; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">⚽ Bolão Copa 2026</div>
  <nav>
    <a href="/">🏠 Jogos</a>
    <a href="/ranking.html">🏆 Ranking</a>
    <a href="/palpites.html" class="active">🔍 Palpites</a>
  </nav>
</header>

<!-- Filtros -->
<div class="controls">
  <input type="text" id="searchInput" placeholder="🔍 Buscar time ou participante…" />
  <select id="filterStatus">
    <option value="all">Todos os jogos</option>
    <option value="closed">Apostas fechadas</option>
    <option value="open">Apostas abertas</option>
    <option value="finished">Com resultado</option>
  </select>
</div>

<!-- Conteúdo principal -->
<div id="root">
  <div class="state-box">
    <div class="spinner"></div>
    <p>Carregando palpites…</p>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────
const API = '';   // mesmo origin; ajuste se necessário

// ── Helpers ───────────────────────────────────────────────────────
const token = () => localStorage.getItem('token');

function fmt(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  return d.toLocaleDateString('pt-BR', {
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit',
  });
}

function betClass(bet, match) {
  if (match.result_home === null || match.result_home === undefined) return 'pending';
  const rH = match.result_home, rA = match.result_away;
  const bH = bet.bet_home,      bA = bet.bet_away;
  if (bH === rH && bA === rA) return 'exact';
  const rWin = Math.sign(rH - rA), bWin = Math.sign(bH - bA);
  if (rWin === bWin) return 'winner';
  return 'wrong';
}

function ptsClass(pts) {
  if (pts === null || pts === undefined) return '';
  if (pts >= 10) return 'p10';
  if (pts >= 7)  return 'p7';
  if (pts >= 5)  return 'p5';
  return 'p0';
}

// ── Fetch data ────────────────────────────────────────────────────
let allMatches = [];

async function loadData() {
  try {
    const res = await fetch(`${API}/api/bets/all-by-match`, {
      headers: { Authorization: `Bearer ${token()}` },
    });
    if (res.status === 401) {
      document.getElementById('root').innerHTML = `
        <div class="state-box">
          <p>🔒 Faça <a href="/" style="color:var(--accent)">login</a> para ver os palpites.</p>
        </div>`;
      return;
    }
    const data = await res.json();
    allMatches = data.matches || [];
    render(allMatches);
  } catch (e) {
    document.getElementById('root').innerHTML = `
      <div class="state-box">
        <p>❌ Erro ao carregar palpites. Verifique se o servidor está online.</p>
      </div>`;
  }
}

// ── Render ────────────────────────────────────────────────────────
function render(matches) {
  if (!matches.length) {
    document.getElementById('root').innerHTML = `
      <div class="state-box"><p>Nenhum jogo encontrado.</p></div>`;
    return;
  }

  const list = document.createElement('div');
  list.className = 'matches-list';

  matches.forEach(m => {
    const card = document.createElement('div');
    card.className = 'match-card';
    card.dataset.matchId = m.id;

    const isClosed = m.betting_closed || m.is_finished;
    const hasResult = m.is_finished && m.result_home !== null && m.result_home !== undefined;
    const scoreText = hasResult ? `${m.result_home} – ${m.result_away}` : 'vs';
    const badgeHtml = m.is_finished
      ? `<span class="badge badge-done">✅ Encerrado</span>`
      : m.betting_closed
        ? `<span class="badge badge-closed">🔒 Fechado</span>`
        : `<span class="badge badge-open">🟢 Aberto</span>`;

    card.innerHTML = `
      <div class="match-header">
        <div class="match-teams">
          <span class="flag">${m.home_flag || '🏳️'}</span>
          ${m.home_team}
          <span class="match-score">${scoreText}</span>
          ${m.away_team}
          <span class="flag">${m.away_flag || '🏳️'}</span>
        </div>
        <div class="match-meta">
          <span>${fmt(m.match_date)}</span>
          <span>${m.stadium ? m.stadium + ' · ' : ''}${m.city || ''}</span>
        </div>
        ${badgeHtml}
        <span class="chevron">▼</span>
      </div>
      <div class="bets-panel">
        ${buildBetsPanel(m)}
      </div>
    `;

    // Toggle expand
    card.querySelector('.match-header').addEventListener('click', () => {
      card.classList.toggle('open');
    });

    list.appendChild(card);
  });

  document.getElementById('root').innerHTML = '';
  document.getElementById('root').appendChild(list);
}

function buildBetsPanel(m) {
  const hasResult = m.is_finished && m.result_home !== null && m.result_home !== undefined;

  if (!m.bets.length) {
    return `<div class="empty-bets">Nenhum palpite registrado para este jogo ainda.</div>`;
  }

  // Com resultado: ordenar por pontos (maior primeiro); sem resultado: alfabético
  const sorted = [...m.bets].sort((a, b) => {
    if (hasResult) return (b.points_earned ?? -1) - (a.points_earned ?? -1);
    return (a.user_name || '').localeCompare(b.user_name || '');
  });

  return buildTable(sorted, m);
}

function buildTable(bets, match) {
  const hasResult = match.result_home !== null && match.result_home !== undefined;

  const rows = bets.map(b => {
    const cls  = betClass(b, match);
    const pCls = ptsClass(b.points_earned);
    const youTag = b.is_mine ? '<span class="you-tag">Você</span>' : '';
    const nameEl = `<span class="${b.is_mine ? 'user-me' : ''}">${b.user_name}${youTag}</span>`;
    const ptsEl  = hasResult && b.is_scored
      ? `<span class="pts ${pCls}">${b.points_earned} pts</span>`
      : `<span style="color:var(--muted)">—</span>`;

    return `
      <tr>
        <td>${nameEl}</td>
        <td><span class="bet-score ${cls}">${b.bet_home} – ${b.bet_away}</span></td>
        <td>${ptsEl}</td>
      </tr>
    `;
  }).join('');

  return `
    <table>
      <thead>
        <tr>
          <th>Participante</th>
          <th>Palpite</th>
          <th>Pontos</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

// ── Filtros ───────────────────────────────────────────────────────
function applyFilters() {
  const q       = document.getElementById('searchInput').value.toLowerCase().trim();
  const status  = document.getElementById('filterStatus').value;

  const filtered = allMatches.filter(m => {
    // Filtro de status
    if (status === 'closed'   && !m.bets_closed) return false;
    if (status === 'open'     && m.bets_closed)  return false;
    if (status === 'finished' && m.result_home === null) return false;

    // Filtro de busca: nome do time ou participante
    if (!q) return true;
    const inTeams = m.home_team.toLowerCase().includes(q) ||
                    m.away_team.toLowerCase().includes(q);
    const inUsers = m.bets.some(b => b.user_name?.toLowerCase().includes(q));
    return inTeams || inUsers;
  });

  render(filtered);
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('filterStatus').addEventListener('change', applyFilters);

// ── Init ──────────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
